name: Publish app

on:
  release:
    types:
      - released
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach to
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Checksum
        run: |
          mkdir -p release
          cp dist/*.dmg dist/*.zip release/
          cd release
          for file in ./*; do
            shasum -a 256 "${file#./}" >> "${file%.*}.sha256"
          done
          ls -l

      - name: Upload GitHub release assets
        run: gh release upload "$TAG" release/* --clobber
        env:
          GH_TOKEN: ${{ github.token }}
